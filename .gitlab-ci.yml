image: docker:29

# Janus CI/CD follows the server's DraftGG golden path:
# - verify and build automatically on `develop` and on tags `v*`;
# - deploy DEV manually from `develop`;
# - deploy PROD automatically from a `v*` tag.
#
# Required GitLab CI/CD variables (use environment-scoped values):
#   JANUS_POSTGRES_PASSWORD
#   JANUS_ADMIN_PASSWORD
#   JANUS_OPENBAO_TOKEN
# Optional variables:
#   JANUS_ADMIN_EMAIL (defaults to admin@localhost)
#   JANUS_PRIVATE_DESTINATIONS_ENABLED (defaults to false) â€” lets an API be registered as living on
#     the deployment's own local network. Not a secret, so leave it unmasked; scope it to the one
#     environment that needs it rather than setting it for the project.

stages:
  - test
  - build
  - deploy

variables:
  APP_SUBDOMAIN: janus
  DOCKER_BUILDKIT: "1"
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_TLS_CERTDIR: ""

.docker_defaults: &docker_defaults
  image: docker:29
  tags:
    - devops
  before_script:
    - set -euo pipefail
    - docker info
    - |
      if [[ -z "${CI_REGISTRY:-}" ]]; then
        echo "CI_REGISTRY is not set." >&2
        exit 1
      fi
    - export CI_REGISTRY_IMAGE="${CI_REGISTRY_IMAGE:-${CI_REGISTRY}/${CI_PROJECT_PATH}}"
    - export IMAGE_TAG="${CI_COMMIT_TAG:-${CI_COMMIT_REF_SLUG}}"
    - echo "${CI_REGISTRY_PASSWORD:-${CI_JOB_TOKEN}}" | docker login --username "${CI_REGISTRY_USER:-gitlab-ci-token}" --password-stdin "${CI_REGISTRY}"

.deploy_defaults: &deploy_defaults
  image: docker:29
  tags:
    - devops
  before_script:
    - set -euo pipefail
    - docker info
    - |
      if [[ -z "${CI_REGISTRY:-}" ]]; then
        echo "CI_REGISTRY is not set." >&2
        exit 1
      fi
    - export CI_REGISTRY_IMAGE="${CI_REGISTRY_IMAGE:-${CI_REGISTRY}/${CI_PROJECT_PATH}}"
    - export IMAGE_TAG="${CI_COMMIT_TAG:-${CI_COMMIT_REF_SLUG}}"
    - set -a; source deploy/paths.env; set +a
    - |
      if [[ -n "${CI_COMMIT_TAG:-}" ]]; then
        export DEPLOY_ENV=prod
        export APP_HOST="${APP_SUBDOMAIN}.kisukesaama.com"
      else
        export DEPLOY_ENV=dev
        export APP_HOST="${APP_SUBDOMAIN}-d.kisukesaama.com"
      fi
    - export TARGET_DIR="${DEPLOY_DIR}/${DEPLOY_ENV}"
    - export ENV_DATA_DIR="${DATA_DIR}/${DEPLOY_ENV}"
    - |
      validate_paths() {
        case "${DEPLOY_DIR:-}" in
          /home/kisuke/*) ;;
          *) echo "DEPLOY_DIR must stay under /home/kisuke/." >&2; exit 1 ;;
        esac
        case "${DATA_DIR:-}" in
          /home/kisuke/*) ;;
          *) echo "DATA_DIR must stay under /home/kisuke/." >&2; exit 1 ;;
        esac
        case "${DEPLOY_DIR}${DATA_DIR}" in
          *..*) echo "Deployment paths cannot contain '..'." >&2; exit 1 ;;
        esac
      }

      write_runtime_files() {
        local target="$1"
        : "${JANUS_POSTGRES_PASSWORD:?Set JANUS_POSTGRES_PASSWORD for ${CI_ENVIRONMENT_NAME:-this environment}}"
        : "${JANUS_ADMIN_PASSWORD:?Set JANUS_ADMIN_PASSWORD for ${CI_ENVIRONMENT_NAME:-this environment}}"
        : "${JANUS_OPENBAO_TOKEN:?Set JANUS_OPENBAO_TOKEN for ${CI_ENVIRONMENT_NAME:-this environment}}"

        # Both environments keep file-backed OpenBao storage. The seal key lets the vault return
        # after a container or host restart without a manual unseal.
        : "${JANUS_OPENBAO_SEAL_KEY:?Set JANUS_OPENBAO_SEAL_KEY for ${CI_ENVIRONMENT_NAME:-this environment}: openssl rand -base64 32}"
        if [ "$(printf '%s' "${JANUS_OPENBAO_SEAL_KEY}" | base64 -d 2>/dev/null | wc -c)" -ne 32 ]; then
          echo "JANUS_OPENBAO_SEAL_KEY must be 32 random bytes in base64: openssl rand -base64 32" >&2
          exit 1
        fi

        # Deployed instances run the production profile, whose PasswordPolicy refuses a weak
        # bootstrap password. Restating the shape here is duplication, and worth it: caught at
        # startup instead, it is a container restarting behind a health check that can only say
        # "unhealthy", with the reason buried in a log the runner never reads.
        needs=""
        [ "${#JANUS_ADMIN_PASSWORD}" -ge 8 ] || needs="${needs}, 8 characters"
        case "$JANUS_ADMIN_PASSWORD" in *[a-z]*) ;; *) needs="${needs}, a lower-case letter" ;; esac
        case "$JANUS_ADMIN_PASSWORD" in *[A-Z]*) ;; *) needs="${needs}, an upper-case letter" ;; esac
        case "$JANUS_ADMIN_PASSWORD" in *[0-9]*) ;; *) needs="${needs}, a digit" ;; esac
        if [ -n "$needs" ]; then
          echo "JANUS_ADMIN_PASSWORD for ${CI_ENVIRONMENT_NAME:-this environment} still needs:${needs#,}" >&2
          exit 1
        fi

        mkdir -p "${target}/.secrets" "${target}/openbao"
        cp deploy/compose.yml "${target}/compose.yml"
        cp deploy/paths.env "${target}/paths.env"
        cp deploy/openbao/openbao.hcl "${target}/openbao/openbao.hcl"
        cp deploy/openbao/bootstrap.sh "${target}/openbao/bootstrap.sh"
        printf '%s\n' \
          "DEPLOY_ENV=${DEPLOY_ENV}" \
          "APP_HOST=${APP_HOST}" \
          "CI_REGISTRY_IMAGE=${CI_REGISTRY_IMAGE}" \
          "IMAGE_TAG=${IMAGE_TAG}" \
          "JANUS_ADMIN_EMAIL=${JANUS_ADMIN_EMAIL:-admin@localhost}" \
          "JANUS_PRIVATE_DESTINATIONS_ENABLED=${JANUS_PRIVATE_DESTINATIONS_ENABLED:-false}" \
          > "${target}/app.env"

        (umask 077; printf '%s' "${JANUS_POSTGRES_PASSWORD}" > "${target}/.secrets/postgres_password")
        (umask 077; printf '%s' "${JANUS_ADMIN_PASSWORD}" > "${target}/.secrets/admin_password")
        (umask 077; printf '%s' "${JANUS_OPENBAO_TOKEN}" > "${target}/.secrets/openbao_token")
        (umask 077; printf '%s' "${JANUS_OPENBAO_SEAL_KEY}" > "${target}/.secrets/openbao_seal_key")
      }

      stage_on_host() {
        local source_dir="$1"
        local target_rel="${TARGET_DIR#/home/kisuke/}"
        local data_rel="${DATA_DIR#/home/kisuke/}"

        # The Docker runner mounts the host socket, but not /home/kisuke. Copy
        # through a short-lived container so Compose bind paths exist on the host.
        tar -C "${source_dir}" -cf - . | docker run --rm -i \
          -e TARGET_REL="${target_rel}" \
          -e DATA_REL="${data_rel}" \
          -e DEPLOY_ENV="${DEPLOY_ENV}" \
          -v /home/kisuke:/host-home \
          alpine:3.24 sh -euc '
            case "$TARGET_REL" in ""|/*|*..*) exit 1 ;; esac
            case "$DATA_REL" in ""|/*|*..*) exit 1 ;; esac
            host_target="/host-home/$TARGET_REL"
            host_data="/host-home/$DATA_REL/$DEPLOY_ENV"
            mkdir -p "$host_target" "$host_data/postgres" "$host_data/openbao" "$host_data/openbao-bootstrap"
            tar -C "$host_target" -xf -
            chmod 750 "$host_target" "$host_target/openbao" "$host_data" "$host_data/postgres" "$host_data/openbao"
            # Holds the vault root token and its recovery share. Only the bootstrap
            # container, which runs as root, ever needs to reach it.
            chmod 700 "$host_data/openbao-bootstrap"
            chmod 700 "$host_target/.secrets"
            chmod 640 "$host_target/compose.yml" "$host_target/paths.env" "$host_target/app.env"
            chmod 644 "$host_target/openbao/"*
            # Compose file-backed secrets are bind mounts, and the daemon resolves the
            # host path as root: the 700 directory above bounds other host users, not
            # containers. What decides whether a container can read one is the file's
            # own mode, which is why these are handed to the application's uid rather
            # than left readable by everybody. Postgres and the vault bootstrap read
            # theirs as root, before dropping privileges, so 600 covers them too.
            for secret in postgres_password openbao_token admin_password; do
              chown 10001 "$host_target/.secrets/$secret"
              chmod 600 "$host_target/.secrets/$secret"
            done
            # The one exception. The vault entrypoint starts as root and drops to its
            # own user before the server reads the seal stanza, so this file is read
            # by a uid the image chooses. Readable, and nothing else in .secrets is.
            chmod 644 "$host_target/.secrets/openbao_seal_key"
          '
      }

      validate_paths
      mkdir -p "${TARGET_DIR}" "${ENV_DATA_DIR}/postgres" "${ENV_DATA_DIR}/openbao" "${ENV_DATA_DIR}/openbao-bootstrap"
      write_runtime_files "${TARGET_DIR}"
      stage_on_host "${TARGET_DIR}"
    - echo "${CI_REGISTRY_PASSWORD:-${CI_JOB_TOKEN}}" | docker login --username "${CI_REGISTRY_USER:-gitlab-ci-token}" --password-stdin "${CI_REGISTRY}"
    - |
      compose() {
        docker compose -p "${APP_SUBDOMAIN}-${DEPLOY_ENV}" --profile "${DEPLOY_ENV}" \
          --env-file paths.env --env-file app.env -f compose.yml "$@"
      }

      # A rollout that fails on a health condition says only "dependency failed to
      # start": why it failed is in the container's own log, on a host the runner
      # cannot open a shell on. Print it here, or every failure costs a trip to the
      # server before anyone even knows which service refused to come up.
      # A fresh persistent vault starts knowing nothing: no KV mount, no policy, and
      # no idea about the token the backend was handed. Reconciling on every deploy is what
      # makes a fresh server work on the first pipeline; it is a no-op once it matches.
      bootstrap_openbao() {
        compose --profile bootstrap run --rm openbao-init
      }

      deploy() {
        compose pull
        compose up -d --remove-orphans && bootstrap_openbao && return 0
        echo "Deployment failed. Container state and recent logs follow." >&2
        compose ps -a >&2 || true
        compose logs --no-color --tail 200 >&2 || true
        return 1
      }

# ---- test -----------------------------------------------------------------
test_backend:
  stage: test
  tags: [devops]
  image: maven:3.9.16-eclipse-temurin-25
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  cache:
    key: janus-maven
    paths:
      - .m2/repository
  script:
    - mvn -B -ntp verify
    - >-
      awk -F, 'NR>1 {m+=$4; c+=$5} END {printf "Coverage: %.1f%%\n", 100*c/(m+c)}'
      target/site/jacoco/jacoco.csv
    # The resolved dependency tree, written here because this is the one job whose local
    # repository is already warm. scan_dependencies reads it instead of pom.xml: reading a pom
    # means resolving the Spring parent and its BOM imports over the network, and Maven Central
    # answers a shared CI address with 429 and a half-hour block on the whole runner.
    - >-
      mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom
      -DoutputFormat=json -DoutputName=sbom -DincludeTestScope=false
  coverage: '/Coverage: (\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
    paths:
      - target/site/jacoco
      - target/sbom.json
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

test_frontend:
  stage: test
  tags: [devops]
  image: node:24-alpine
  cache:
    key: janus-npm
    paths:
      - frontend/.npm
  before_script:
    - npm config set cache "$CI_PROJECT_DIR/frontend/.npm"
  script:
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm run lint
    # With coverage, so the floor in vite.config.ts is actually enforced somewhere. `npm test`
    # stays the fast one for whoever is running it in a loop while writing a component.
    - npm run test:coverage
    - npm run build
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Advisories against what the two dependency sets pin, before anything is built. Neither pass
# reaches the network for anything but the vulnerability database, so this answers in a minute
# and needs no NVD key.
#
# The backend side reads the SBOM test_backend wrote, not pom.xml. Trivy can only read a pom by
# resolving the Spring parent and its BOM imports from Maven Central, which rate limits shared CI
# addresses: one 429 blocks every request from the runner for the next half hour. The SBOM already
# names every resolved coordinate, so there is nothing left to look up. npm lockfiles are
# self-contained and stay a plain filesystem scan.
#
# Two passes on purpose. The first reports everything at HIGH and above and never fails: a
# pipeline that goes red on somebody else's disclosure, on a morning nobody changed anything,
# stops being read. The second fails, and only on CRITICAL, the level that is worth stopping a
# release for. Raise it once the backlog at HIGH is empty rather than the other way round.
scan_dependencies:
  stage: test
  tags: [devops]
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  needs:
    - job: test_backend
      artifacts: true
  variables:
    TRIVY_CACHE_DIR: .trivycache
    TRIVY_NO_PROGRESS: "true"
    # Belt and braces against the 429 above: no scanner here has a reason to call a package
    # registry, so a pass that suddenly wants to is a bug, not a slow job.
    TRIVY_OFFLINE_SCAN: "true"
  cache:
    key: janus-trivy
    paths:
      - .trivycache
  script:
    # Created up front so a failure in the CRITICAL passes reports itself, instead of being
    # buried under an artifact collector complaining it has no files to upload.
    - touch critical-backend.txt critical-frontend.txt
    - trivy sbom --scanners vuln --severity HIGH,CRITICAL --exit-code 0 target/sbom.json
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 0 frontend/package-lock.json
    - >-
      trivy sbom --scanners vuln --severity CRITICAL --exit-code 1
      --format table --output critical-backend.txt target/sbom.json
    - >-
      trivy fs --scanners vuln --severity CRITICAL --exit-code 1
      --format table --output critical-frontend.txt frontend/package-lock.json
  artifacts:
    when: always
    paths:
      - critical-backend.txt
      - critical-frontend.txt
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ---- build ----------------------------------------------------------------
build:
  stage: build
  <<: *docker_defaults
  needs:
    - job: test_backend
      artifacts: false
    - job: test_frontend
      artifacts: false
  script:
    - docker build --pull -t "${CI_REGISTRY_IMAGE}/backend:${IMAGE_TAG}" -f Dockerfile .
    - docker build --pull -t "${CI_REGISTRY_IMAGE}/web:${IMAGE_TAG}" -f frontend/Dockerfile frontend
    # Scanned before it is pushed, so a base image with a critical advisory never becomes a tag
    # anybody can deploy. The bill of materials is written for both, which is what makes the next
    # disclosure answerable without rebuilding anything: it says what was actually shipped.
    - |
      # Nothing is bind-mounted out of these: this job runs in a container of its own, and its
      # working directory is not a path the daemon can resolve, so a --output written "to the
      # project" would land in an empty directory on the host. The bill of materials comes back on
      # stdout instead and is redirected here, where the artifact collector will find it.
      trivy() {
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 "$@"
      }

      scan() {
        trivy image --no-progress --scanners vuln --severity HIGH,CRITICAL --exit-code 0 "$1"
        trivy image --quiet --no-progress --format cyclonedx "$1" > "sbom-$2.json"
        trivy image --no-progress --scanners vuln --severity CRITICAL --exit-code 1 "$1"
      }
    - scan "${CI_REGISTRY_IMAGE}/backend:${IMAGE_TAG}" backend
    - scan "${CI_REGISTRY_IMAGE}/web:${IMAGE_TAG}" web
    - docker push "${CI_REGISTRY_IMAGE}/backend:${IMAGE_TAG}"
    - docker push "${CI_REGISTRY_IMAGE}/web:${IMAGE_TAG}"
  artifacts:
    when: always
    paths:
      - sbom-backend.json
      - sbom-web.json
    expire_in: 1 month
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'

# ---- deploy DEV (manual from develop) -------------------------------------
deploy_dev:
  stage: deploy
  <<: *deploy_defaults
  needs: ["build"]
  resource_group: janus-dev
  environment:
    name: dev
    url: https://janus-d.kisukesaama.com
    on_stop: stop_dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
  script:
    - cd "${TARGET_DIR}"
    - deploy

stop_dev:
  stage: deploy
  <<: *deploy_defaults
  resource_group: janus-dev
  environment:
    name: dev
    action: stop
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
  script:
    - cd "${TARGET_DIR}"
    - compose down

# ---- deploy PROD (automatic from v* tags) ---------------------------------
deploy_prod:
  stage: deploy
  <<: *deploy_defaults
  needs: ["build"]
  resource_group: janus-prod
  environment:
    name: production
    url: https://janus.kisukesaama.com
    on_stop: stop_prod
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
  script:
    - cd "${TARGET_DIR}"
    - deploy

stop_prod:
  stage: deploy
  <<: *deploy_defaults
  resource_group: janus-prod
  environment:
    name: production
    action: stop
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
      when: manual
  script:
    - cd "${TARGET_DIR}"
    - compose down
