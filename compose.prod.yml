name: janus
# Everything here logs to stdout, and Docker's default json-file driver keeps every line ever
# written. On a host that stays up for months that file is what fills the disk first — ahead of the
# database, because it grows with traffic rather than with what anybody configures. Ten megabytes
# across three files caps each service at 30 MB and still leaves several days of history.
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  reverse-proxy:
    logging: *logging
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    ports: ["80:80", "443:443"]
    volumes: ["./deploy/certs:/etc/nginx/certs:ro"]
    networks: [public, private]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
  backend:
    logging: *logging
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JANUS_DATABASE_URL: jdbc:postgresql://postgres:5432/janus
      JANUS_DATABASE_USERNAME: janus
      OPENBAO_ADDR: http://openbao:8200
      JANUS_CORS_ORIGINS: https://${JANUS_PUBLIC_HOST:?Set JANUS_PUBLIC_HOST}
      JANUS_ADMIN_EMAIL: ${JANUS_ADMIN_EMAIL:-admin@localhost}
    secrets: [postgres_password, openbao_token, admin_password]
    networks: [private, egress]
    depends_on:
      postgres: {condition: service_healthy}
      openbao: {condition: service_healthy}
    healthcheck: {test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"], interval: 10s, timeout: 5s, retries: 20, start_period: 30s}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
  postgres:
    logging: *logging
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: janus
      POSTGRES_USER: janus
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: ["postgres_prod:/var/lib/postgresql/data"]
    networks: [private]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U janus -d janus"], interval: 10s, timeout: 5s, retries: 10}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  # Static seal auto-unseal needs OpenBao 2.4.0 or newer; older images reject the stanza.
  openbao:
    logging: *logging
    image: openbao/openbao:2.6
    command: server
    cap_add: ["IPC_LOCK"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes: ["./deploy/openbao/openbao.hcl:/openbao/config/openbao.hcl:ro", "openbao_prod:/openbao/file"]
    secrets: [openbao_seal_key]
    networks: [private]
    healthcheck: {test: ["CMD-SHELL", "bao status >/dev/null 2>&1 || [ $$? -eq 2 ]"], interval: 10s, timeout: 5s, retries: 30}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  # Run once after `up`: docker compose -f compose.prod.yml --profile bootstrap run --rm openbao-init
  openbao-init:
    logging: *logging
    image: openbao/openbao:2.6
    profiles: [bootstrap]
    user: "0:0"
    entrypoint: ["/bin/sh", "/etc/openbao/bootstrap.sh"]
    environment:
      BAO_ADDR: http://openbao:8200
    volumes: ["./deploy/openbao/bootstrap.sh:/etc/openbao/bootstrap.sh:ro", "openbao_bootstrap:/bootstrap"]
    secrets: [openbao_token]
    networks: [private]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
networks:
  public:
  private:
    internal: true
  egress:
volumes:
  postgres_prod:
  openbao_prod:
  openbao_bootstrap:
secrets:
  postgres_password: {file: ./.secrets/postgres_password}
  openbao_token: {file: ./.secrets/openbao_token}
  openbao_seal_key: {file: ./.secrets/openbao_seal_key}
  admin_password: {file: ./.secrets/admin_password}
