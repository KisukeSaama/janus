<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Janus keeps API keys out of your services and decides every call before one is read." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2315171b'/%3E%3Crect x='3' y='2' width='4' height='12' fill='%23ff7c30'/%3E%3Crect x='9' y='2' width='4' height='12' fill='%23f2f3f5' opacity='.4'/%3E%3C/svg%3E"
    />
    <title>Janus</title>
    <!-- Paints the stored theme before first render. A file, not an inline block: the console's
         CSP is `script-src 'self'`, which blocks inline scripts outright. -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
