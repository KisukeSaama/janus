# nginx does not merge add_header across levels: a location that sets one header drops
# every header inherited from the server block. These are therefore included explicitly
# in each location rather than declared once at the top.
#
# Included by both deployments: the self-hosted one where nginx terminates TLS itself
# (deploy/nginx/prod.conf) and the pipeline one where Traefik terminates it and this
# image only ever listens on 8080. HSTS therefore lives here rather than beside the
# TLS configuration, or the deployment that actually runs would be the one without it.
# A browser ignores this header on a plain-HTTP response, so local development is
# unaffected by it being stated unconditionally.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
# Janus is an internal console: nothing here should ever reach a search index. The meta tag in
# index.html only covers the HTML document, so the same instruction is carried as a header —
# it applies to every response, including the API and gateway surfaces and hashed assets.
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
# The console loads no third-party code and posts to no other origin, so every fetch
# directive is pinned to self and the legacy escape hatches are closed outright.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
