# Rate limits are per nginx worker set, in front of the application's own throttling.
# Two zones because the two surfaces have very different shapes: the console is used by a
# handful of operators, the gateway by services in a loop.
#
# The rates match the backend's own ceilings (JANUS_RATE_LIMIT_*) and are set for the same
# reason: $binary_remote_addr is one address, and an address is shared by a whole office
# behind a NAT or a whole cluster behind one egress. Anything tight enough to shape ordinary
# traffic refuses those first, so these are sized to stop only a runaway loop or a flood.
limit_req_zone $binary_remote_addr zone=janus_admin:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=janus_gateway:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=janus_static:10m rate=120r/s;

# Request rate alone does not bound concurrency: a caller can hold thousands of sockets open,
# each sending a byte at a time, and never trip a rate limit. Capping connections per address
# is what closes that, and it is also what keeps one client from occupying the worker pool.
limit_conn_zone $binary_remote_addr zone=janus_conn:10m;

# Both default to 503, which reads as "Janus is down" rather than "you are going too fast",
# and is the status the console shows the operator.
limit_req_status 429;
limit_conn_status 429;

# A GraphQL subscription over WebSocket is an HTTP request asking to upgrade. nginx drops the
# Upgrade and Connection headers unless it is told to pass them, and then the backend sees an
# ordinary GET; this is the standard way of passing them only when the caller sent them.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Resolving the upstream at request time rather than at startup. With a literal host name
  # nginx refuses to start if the backend is not yet up, and pins the address it saw then —
  # so a backend that is recreated with a new address becomes unreachable until nginx is too.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $janus_backend "backend:8080";

  client_max_body_size 10m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  # A client that stops reading must not hold a worker and an upstream connection indefinitely.
  send_timeout 30s;
  keepalive_timeout 30s;
  keepalive_requests 500;

  limit_conn janus_conn 256;

  include /etc/nginx/janus-security-headers.conf;

  location /api/ {
    include /etc/nginx/janus-security-headers.conf;
    limit_req zone=janus_admin burst=40 nodelay;
    limit_conn janus_conn 64;
    proxy_pass http://$janus_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  # The optional leading segment is the deployment's own prefix, for a Janus served under a context
  # path rather than at the root. It is passed through untouched: the backend removes the container's
  # prefix itself and matches `/gateway/` on what is left, so nothing here has to guess where one
  # ends. Without a context path configured, only the unprefixed form reaches a route.
  location ~ ^/(?:[^/]+/)?gateway/ {
    include /etc/nginx/janus-security-headers.conf;
    limit_req zone=janus_gateway burst=200 nodelay;
    limit_conn janus_conn 192;
    proxy_pass http://$janus_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_request_buffering on;
    # Buffered, except where the backend says otherwise: a GraphQL subscription relayed as
    # Server-Sent Events is answered with X-Accel-Buffering: no, which nginx honours per response.
    proxy_buffering on;
    # Above the backend's idle allowance for a subscription (JANUS_GRAPHQL_STREAM_IDLE_TIMEOUT_SECONDS,
    # 300 by default), so a quiet stream is closed by the backend, audited, rather than cut here. An
    # ordinary call is still ended by the backend's own 30s response timeout long before this, so its
    # audited 502 wins the race exactly as it did when this was 45s.
    proxy_read_timeout 330s;
  }

  # The token exchange. Proxied explicitly, or the SPA fallback at the bottom would answer a
  # POST to /oauth/token with index.html and the endpoint would simply not exist in production.
  # It takes a secret, so it gets the console's tighter allowance rather than the gateway's: a
  # token lasts fifteen minutes, so no honest client asks for one in a loop.
  location /oauth/ {
    include /etc/nginx/janus-security-headers.conf;
    limit_req zone=janus_admin burst=40 nodelay;
    limit_conn janus_conn 64;
    proxy_pass http://$janus_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  # The MCP endpoint and the discovery documents an MCP client reads before it has a token. Exact
  # match on /mcp: /mcp/authorize is the console's consent screen and stays with the SPA below.
  location = /mcp {
    include /etc/nginx/janus-security-headers.conf;
    limit_req zone=janus_admin burst=40 nodelay;
    limit_conn janus_conn 64;
    proxy_pass http://$janus_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  location /.well-known/ {
    include /etc/nginx/janus-security-headers.conf;
    limit_req zone=janus_admin burst=40 nodelay;
    proxy_pass http://$janus_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 10s;
  }

  # Served explicitly, or the SPA fallback below would answer it with index.html as text/html —
  # which a crawler reads as "no robots.txt here" and takes as permission to crawl everything.
  location = /robots.txt {
    include /etc/nginx/janus-security-headers.conf;
    limit_req zone=janus_static burst=240 nodelay;
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  # Vite emits content-hashed asset names, so they can be cached indefinitely.
  location /assets/ {
    include /etc/nginx/janus-security-headers.conf;
    limit_req zone=janus_static burst=240 nodelay;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html must never be cached, or a deployment stays invisible to returning operators.
  # Uncached and served on every unmatched path, it is the cheapest thing here to request in a
  # loop, so it carries a ceiling too — a generous one, since one console load spends several.
  location / {
    include /etc/nginx/janus-security-headers.conf;
    limit_req zone=janus_static burst=240 nodelay;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}
