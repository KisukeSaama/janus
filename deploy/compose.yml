# Everything here logs to stdout, and Docker's default json-file driver keeps every line ever
# written. On a host that stays up for months that file is what fills the disk first — ahead of the
# database, because it grows with traffic rather than with what anybody configures, and nothing ever
# reads most of it. Ten megabytes across three files caps each service at 30 MB and still leaves
# several days of history for the one thing container logs are for: reading them after an incident.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ${CI_REGISTRY_IMAGE}/web:${IMAGE_TAG}
    logging: *logging
    networks:
      - application
      - traefik
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}.entrypoints=websecure
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}.tls=true
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}.service=${APP_SUBDOMAIN}-${DEPLOY_ENV}
      - traefik.http.services.${APP_SUBDOMAIN}-${DEPLOY_ENV}.loadbalancer.server.port=8080

  backend:
    image: ${CI_REGISTRY_IMAGE}/backend:${IMAGE_TAG}
    logging: *logging
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JANUS_DATABASE_URL: jdbc:postgresql://postgres:5432/janus
      JANUS_DATABASE_USERNAME: janus
      OPENBAO_ADDR: http://openbao:8200
      JANUS_ADMIN_EMAIL: ${JANUS_ADMIN_EMAIL:-admin@localhost}
      JANUS_PRIVATE_DESTINATIONS_ENABLED: ${JANUS_PRIVATE_DESTINATIONS_ENABLED:-false}
      JANUS_CORS_ORIGINS: https://${APP_HOST}
    secrets:
      - postgres_password
      - openbao_token
      - admin_password
    networks:
      - application
      - egress
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine
    logging: *logging
    environment:
      POSTGRES_DB: janus
      POSTGRES_USER: janus
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ${DATA_DIR}/${DEPLOY_ENV}/postgres:/var/lib/postgresql/data
    networks:
      - application
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janus -d janus"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Static seal auto-unseal landed in OpenBao 2.4.0; on 2.3 the seal stanza is rejected
  # outright and the container will not start. DEV and PROD both keep file storage: recreating
  # a DEV container must not erase its credentials.
  openbao:
    image: openbao/openbao:2.6
    logging: *logging
    profiles: [dev, prod]
    # OpenBao 2.6 defaults to its unprivileged user. Start its entrypoint as root so it can repair
    # ownership on a fresh host bind mount; the official entrypoint drops back to `openbao` before
    # launching the server.
    user: "0:0"
    command: server
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - ./openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
      - ${DATA_DIR}/${DEPLOY_ENV}/openbao:/openbao/file
    secrets:
      - openbao_seal_key
    networks:
      - application
    # Exit 2 also covers "not initialised", which is where a brand new volume starts and
    # openbao-init is what leaves. Sealed is no longer reachable once the seal key is in
    # place, so this no longer hides a broken deploy.
    healthcheck:
      test: ["CMD-SHELL", "bao status >/dev/null 2>&1 || [ $$? -eq 2 ]"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Not in an environment profile: the deploy job runs it explicitly so its exit code decides
  # whether the rollout succeeded, instead of a one-shot container failing quietly
  # alongside the long-running ones.
  openbao-init:
    image: openbao/openbao:2.6
    logging: *logging
    profiles: [bootstrap]
    user: "0:0"
    entrypoint: ["/bin/sh", "/etc/openbao/bootstrap.sh"]
    environment:
      BAO_ADDR: http://openbao:8200
    volumes:
      - ./openbao/bootstrap.sh:/etc/openbao/bootstrap.sh:ro
      - ${DATA_DIR}/${DEPLOY_ENV}/openbao-bootstrap:/bootstrap
    secrets:
      - openbao_token
    networks:
      - application
    restart: "no"
    security_opt:
      - no-new-privileges:true

networks:
  application:
    internal: true
  egress: {}
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
  openbao_token:
    file: ./.secrets/openbao_token
  openbao_seal_key:
    file: ./.secrets/openbao_seal_key
  admin_password:
    file: ./.secrets/admin_password
