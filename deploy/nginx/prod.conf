# Reverse proxy for the self-hosted deployment (compose.prod.yml), where nginx terminates
# TLS itself. The GitLab pipeline uses a different path: Traefik terminates TLS and the web
# image serves frontend/nginx.conf on port 8080.

# The rates match the backend's own ceilings (JANUS_RATE_LIMIT_*) and are set for the same
# reason: $binary_remote_addr is one address, and an address is shared by a whole office
# behind a NAT or a whole cluster behind one egress. Anything tight enough to shape ordinary
# traffic refuses those first, so these are sized to stop only a runaway loop or a flood.
limit_req_zone $binary_remote_addr zone=janus_admin:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=janus_gateway:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=janus_static:10m rate=120r/s;

# Request rate alone does not bound concurrency: a caller can hold thousands of sockets open,
# each sending a byte at a time, and never trip a rate limit. Capping connections per address
# is what closes that, and it is also what keeps one client from occupying the worker pool.
limit_conn_zone $binary_remote_addr zone=janus_conn:10m;

# Both default to 503, which reads as "Janus is down" rather than "you are going too fast",
# and is the status the console shows the operator.
limit_req_status 429;
limit_conn_status 429;

# A GraphQL subscription over WebSocket is an HTTP request asking to upgrade. nginx drops the
# Upgrade and Connection headers unless it is told to pass them, and then the backend sees an
# ordinary GET; this is the standard way of passing them only when the caller sent them.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  # Unprivileged ports, because this image drops to nginx's own user. Compose publishes
  # 80 and 443 in front of them, so nothing outside the container changes.
  listen 8080;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 8443 ssl;
  http2 on;
  server_name _;
  server_tokens off;

  ssl_certificate /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_tickets off;
  ssl_session_cache shared:SSL:10m;

  client_max_body_size 10m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  # A client that stops reading must not hold a worker and an upstream connection indefinitely.
  send_timeout 30s;
  keepalive_timeout 30s;
  keepalive_requests 500;

  limit_conn janus_conn 256;

  root /usr/share/nginx/html;
  index index.html;

  # Resolved at request time: a literal host name would keep nginx from starting before the
  # backend exists, and would pin the address it saw at startup.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $janus_backend "backend:8080";

  include /etc/nginx/janus-security-headers.conf;

  location /api/ {
    include /etc/nginx/janus-security-headers.conf;
    limit_req zone=janus_admin burst=40 nodelay;
    limit_conn janus_conn 64;
    proxy_pass http://$janus_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # Set, not appended. nginx is the first hop here, so there is no earlier proxy whose entry is
    # worth keeping — only a caller's own header, which it would be handing itself as an identity.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
  }

  location ~ ^/(?:[^/]+/)?gateway/ {
    include /etc/nginx/janus-security-headers.conf;
    limit_req zone=janus_gateway burst=200 nodelay;
    limit_conn janus_conn 192;
    proxy_pass http://$janus_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # Set, not appended. nginx is the first hop here, so there is no earlier proxy whose entry is
    # worth keeping — only a caller's own header, which it would be handing itself as an identity.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_request_buffering on;
    # Buffered, except where the backend says otherwise: a GraphQL subscription relayed as
    # Server-Sent Events is answered with X-Accel-Buffering: no, which nginx honours per response.
    proxy_buffering on;
    # Long enough for a subscription that is quiet between events. The backend closes one that has
    # heard nothing from its upstream for JANUS_GRAPHQL_STREAM_IDLE_TIMEOUT_SECONDS (300 by default),
    # and an ordinary call is bounded far below this by the backend's own response timeout.
    proxy_read_timeout 330s;
  }

  # The token exchange. Proxied explicitly, or the SPA fallback at the bottom would answer a
  # POST to /oauth/token with index.html and the endpoint would simply not exist in production.
  # It takes a secret, so it gets the console's tighter allowance rather than the gateway's.
  location /oauth/ {
    include /etc/nginx/janus-security-headers.conf;
    limit_req zone=janus_admin burst=40 nodelay;
    limit_conn janus_conn 64;
    proxy_pass http://$janus_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
  }

  # Served explicitly, or the SPA fallback below would answer it with index.html as text/html —
  # which a crawler reads as "no robots.txt here" and takes as permission to crawl everything.
  location = /robots.txt {
    include /etc/nginx/janus-security-headers.conf;
    limit_req zone=janus_static burst=240 nodelay;
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location /assets/ {
    include /etc/nginx/janus-security-headers.conf;
    limit_req zone=janus_static burst=240 nodelay;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Uncached and served on every unmatched path, index.html is the cheapest thing here to request
  # in a loop, so it carries a ceiling too — a generous one, since one console load spends several.
  location / {
    include /etc/nginx/janus-security-headers.conf;
    limit_req zone=janus_static burst=240 nodelay;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}
