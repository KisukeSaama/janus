name: janus-dev
# Same cap as the deployed compose files. A development machine is not the server, but a stack left
# up for a week accumulates the same way, and 30 MB per service is still more history than anybody
# scrolls back through.
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  postgres:
    logging: *logging
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-janus}
      POSTGRES_USER: ${POSTGRES_USER:-janus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes: ["postgres_dev:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 3s, retries: 20}
  openbao:
    logging: *logging
    # Keep local development on the same OpenBao line as deployments. The 2.6 image runs as the
    # `openbao` user by default and starts its dev server without a manual privilege transition.
    image: openbao/openbao:2.6
    cap_add: ["IPC_LOCK"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_ROOT_TOKEN:?Set OPENBAO_DEV_ROOT_TOKEN in .env}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      BAO_ADDR: http://127.0.0.1:8200
    command: server -dev
    ports: ["8200:8200"]
    healthcheck: {test: ["CMD", "bao", "status"], interval: 5s, timeout: 3s, retries: 20}
  backend:
    logging: *logging
    build: .
    environment:
      JANUS_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-janus}
      JANUS_DATABASE_USERNAME: ${POSTGRES_USER:-janus}
      JANUS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ${OPENBAO_DEV_ROOT_TOKEN:?Set OPENBAO_DEV_ROOT_TOKEN in .env}
      JANUS_ADMIN_PASSWORD: ${JANUS_ADMIN_PASSWORD:?Set JANUS_ADMIN_PASSWORD in .env}
      JANUS_ADMIN_EMAIL: ${JANUS_ADMIN_EMAIL:-admin@localhost}
      JANUS_CORS_ORIGINS: http://localhost:5173
      JANUS_ALLOW_PRIVATE_DESTINATIONS: ${JANUS_ALLOW_PRIVATE_DESTINATIONS:-false}
      JANUS_PRIVATE_DESTINATIONS_ENABLED: ${JANUS_PRIVATE_DESTINATIONS_ENABLED:-false}
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      openbao: {condition: service_healthy}
  frontend:
    logging: *logging
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --mode docker"
    volumes: ["./frontend:/app", "frontend_node_modules:/app/node_modules"]
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres_dev:
  frontend_node_modules:
